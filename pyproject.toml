[project]
name = "recall-evidence-agent"
version = "0.1.0"
description = "Traceable investigation of US vehicle complaints and recalls"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2,<3",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3,<4",
    "pypdf>=6,<8",
    "numpy>=2,<3",
    "onnxruntime>=1.22,<2",
    "tokenizers>=0.22,<0.23",
    "qdrant-client>=1.16,<2",
]

[tool.uv]
package = false
cache-dir = ".local/uv-cache"
